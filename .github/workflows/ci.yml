name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install ruff==0.15.8 pytest numpy
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      # The TensorFlow end-to-end test skips itself here; run it locally after
      # "pip install -r requirements.txt".
      - name: Test
        run: pytest -q
